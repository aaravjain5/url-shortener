services:
  redis:
    image: redis:7-alpine
    container_name: url-shortener-redis
    ports:
      - "6380:6379"
    volumes:
      - redis-data:/data

  app1:
    build: .
    container_name: url-shortener-app1
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - INSTANCE_NAME=app1
    depends_on:
      - redis

  app2:
    build: .
    container_name: url-shortener-app2
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - INSTANCE_NAME=app2
    depends_on:
      - redis

  app3:
    build: .
    container_name: url-shortener-app3
    environment:
      - PORT=3000
      - REDIS_URL=redis://redis:6379
      - INSTANCE_NAME=app3
    depends_on:
      - redis

  nginx:
    image: nginx:alpine
    container_name: url-shortener-nginx
    ports:
      - "3000:80"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - app1
      - app2
      - app3

volumes:
  redis-data: